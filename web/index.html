    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Analects 2.17",
        "url": "https://analects2.com/",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "description": "A stock screener and ranking tool for value investing and fundamental analysis — scores every mid and large-cap public company on valuation, momentum, profitability, growth, and more.",
        "keywords": "stock screener, stock ranking, value investing, fundamental analysis, equity research",
        "offers": {
          "@type": "Offer",
          "price": "2.00",
          "priceCurrency": "USD",
          "priceSpecification": {
            "@type": "UnitPriceSpecification",
            "price": "2.00",
            "priceCurrency": "USD",
            "billingDuration": "P1M"
          }
        }
      }
    </script>

    <!-- Mirrors the FAQ section on the landing page (web/src/pages/LandingPage.tsx, FAQS array) — keep the two in sync. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What counts as \"mid and large-cap\"?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The ranked universe is data-driven: every SEC-registered company is screened, and anything above roughly a $2B market cap qualifies — no hand-picked index list."
            }
          },
          {
            "@type": "Question",
            "name": "Where does the stock data come from?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Live prices from Yahoo Finance and official financial statements from SEC EDGAR — refreshed daily."
            }
          },
          {
            "@type": "Question",
            "name": "How is the stock ranking score calculated?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Each fundamental metric is ranked cross-sectionally against every other company (percentile or z-score), combined across up to 5 fiscal years with heavier weight on recent years, then rolled up into category and overall scores using the weights you choose."
            }
          },
          {
            "@type": "Question",
            "name": "Can I customize the stock screener's weighting for value investing?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes — every category and individual metric has a live weight slider on the Rankings page. The whole universe re-ranks instantly, no waiting for a batch job."
            }
          },
          {
            "@type": "Question",
            "name": "Is this investment advice?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Analects 2.17 is a research and screening tool, not investment advice."
            }
          },
          {
            "@type": "Question",
            "name": "Can I cancel anytime?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, from the billing portal — no phone calls, no retention flow."
            }
          }
        ]
      }
    </script>

  <body>

  </body>
